services:
  - type: web
    name: tutorialapi
    runtime: docker
    plan: free
    region: oregon
    buildCommand: echo "Build handled by Dockerfile"
    startCommand: java -jar app.jar
    healthCheckPath: /swagger-ui.html
    healthCheckInterval: 60
    healthCheckTimeout: 30
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: tutorialapi-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tutorialapi-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: tutorialapi-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: tutorialapi-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tutorialapi-db
          property: password

databases:
  - name: tutorialapi-db
    ipAllowList: []


