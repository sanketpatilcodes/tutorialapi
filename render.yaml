services:
  - type: web
    name: tutorialapi
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: tutorialapi-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: tutorialapi-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: tutorialapi-db
          property: password

databases:
  - name: tutorialapi-db
    ipAllowList: []




